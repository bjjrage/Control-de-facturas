# ==============================================================================
# ENTERPRISE DEPLOYMENT PACK — DOCKER COMPOSE (GATE 21)
# Despliegue on-premise / cloud empresarial reproducible para Construction Intelligence
# Incluye:
# 1. Aplicación Web Next.js (SSR / API Routes)
# 2. PostgreSQL 16 con extensiones vectoriales / RLS
# 3. MinIO / S3 Storage local para Bóveda y Documentos
# 4. Redis para colas y rate limiting resiliente
# 5. Reverse Proxy NGINX con terminación TLS y compresión
# ==============================================================================

version: '3.8'

services:
  # 1. Reverse Proxy & SSL Termination
  gateway:
    image: nginx:alpine
    container_name: construct_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - web

  # 2. Next.js Enterprise Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construct_web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=http://postgres:5432
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://storage:9000
    depends_on:
      - postgres
      - redis
      - storage
    expose:
      - "3000"

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: construct_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-construct_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction_StrongPass123!}
      POSTGRES_DB: ${POSTGRES_DB:-construct_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-construct_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. S3 Compatible Storage (MinIO)
  storage:
    image: minio/minio:latest
    container_name: construct_storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMeStoragePass123!}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"

  # 5. Redis Cache & Job Queues
  redis:
    image: redis:7-alpine
    container_name: construct_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"

volumes:
  postgres_data:
  minio_data:
  redis_data:
