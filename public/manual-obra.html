<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>niu.pack — Demo del Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0a0b0f; --panel:#14151b; --panel-2:#1a1c24; --hover:#1e202a;
    --fg:#f2f3f5; --muted:#8b93a3; --border:#24262f;
    --primary:#d97706; --primary-hover:#f59e0b; --primary-bg:#2d1d04;
    --nav-active:#5b7cfa;
    --ok:#34d399; --ok-bg:#103226; --warn:#f5a524; --warn-bg:#3a2c0f;
    --error:#f2685c; --error-bg:#3a1c19; --neutral-bg:#21232c;
    --purple:#a78bfa; --purple-bg:#241f3d; --teal:#2dd4bf; --teal-bg:#0f2c29;
    --orange:#fb923c; --orange-bg:#3a230f;
    --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    --sidebar-w:216px;
  }
  *{box-sizing:border-box;border-color:var(--border)}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.55}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  ::selection{background:#33396b}

  /* ---------- Shell ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
  .sb-brand{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700;letter-spacing:-.01em}
  .sb-brand .dot{color:var(--primary)}
  .plan-switch{padding:10px 12px;border-bottom:1px solid var(--border)}
  .plan-switch .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
  .plan-btns{display:flex;gap:3px}
  .plan-btn{flex:1;font-size:10px;font-weight:600;padding:5px 2px;border-radius:5px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted)}
  .plan-btn.active{background:var(--nav-active);border-color:var(--nav-active);color:#fff}
  nav.sb-nav{flex:1;padding:8px 8px 24px;overflow-y:auto}
  .sb-group{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:14px 10px 5px}
  .sb-link{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .1s,color .1s}
  .sb-link:hover{background:var(--hover);color:var(--fg)}
  .sb-link.active{background:var(--nav-active);color:#fff;font-weight:500}
  .sb-link .ico{width:15px;height:15px;flex-shrink:0;opacity:.85}
  .sb-link.active .ico{opacity:1}

  main.content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px;position:sticky;top:0;background:var(--bg);z-index:20}
  .crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0}
  .crumb b{color:var(--fg);font-weight:600}
  .crumb .sep{opacity:.4}
  .top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .mode-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .mode-toggle button{padding:5px 12px;font-size:12px;font-weight:600;background:var(--panel);color:var(--muted);border:none}
  .mode-toggle button.active{background:var(--nav-active);color:#fff}
  .help-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-weight:700;font-size:13px}
  .help-btn:hover{color:var(--fg);border-color:var(--muted)}

  .screen{padding:24px 26px 80px;max-width:1080px}
  .page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .page-h h1{font-size:19px;font-weight:600;margin:0}
  .page-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

  /* ---------- Bits ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:7px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--panel);color:var(--fg)}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:linear-gradient(160deg,#fbbf24 0%,#b45309 100%);border-color:rgba(251,191,36,.35);color:#1a0e00}
  .btn.primary:hover{background:linear-gradient(160deg,#fcd34d 0%,#d97706 100%)}
  .btn.sm{height:27px;padding:0 10px;font-size:12px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
  .kpi{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:14px;display:flex;gap:11px;align-items:center}
  .kpi .ring{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
  .kpi .v{font-size:20px;font-weight:600;line-height:1}
  .kpi .l{font-size:11.5px;color:var(--muted);margin-top:3px}
  .r-primary{background:var(--primary-bg);color:var(--primary)}
  .r-teal{background:var(--teal-bg);color:var(--teal)}
  .r-purple{background:var(--purple-bg);color:var(--purple)}
  .r-orange{background:var(--orange-bg);color:var(--orange)}
  .r-ok{background:var(--ok-bg);color:var(--ok)}
  .r-warn{background:var(--warn-bg);color:var(--warn)}

  .card{border:1px solid var(--border);background:var(--panel);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .card-h{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-b{padding:14px}

  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:var(--hover)}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .t-wrap{overflow-x:auto}

  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .b-ok{background:var(--ok-bg);color:var(--ok)}
  .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-err{background:var(--error-bg);color:var(--error)}
  .b-neutral{background:var(--neutral-bg);color:var(--muted)}
  .b-accent{background:var(--purple-bg);color:var(--purple)}
  .b-teal{background:var(--teal-bg);color:var(--teal)}

  .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;min-width:70px}
  .bar > i{display:block;height:100%;background:var(--nav-active);border-radius:3px}
  .bar.warn > i{background:var(--warn)}
  .bar.ok > i{background:var(--ok)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted)}
  .chip.active{background:var(--hover);color:var(--fg);border-color:var(--muted)}
  .inp{height:32px;border:1px solid var(--border);background:var(--panel-2);border-radius:7px;padding:0 10px;font-size:13px;color:var(--fg)}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
  .tab{padding:9px 13px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--fg);border-color:var(--nav-active)}

  .proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .proj-card{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:15px;cursor:pointer;transition:border-color .12s}
  .proj-card:hover{border-color:var(--muted)}
  .proj-card .code{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .proj-card h3{font-size:14.5px;font-weight:600;margin:3px 0 10px}
  .proj-card .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:7px}

  .photo-row{display:flex;gap:5px;align-items:center}
  .photo{width:30px;height:30px;border-radius:5px;border:1px solid var(--border);position:relative;overflow:hidden;flex-shrink:0}
  .photo .vdot{position:absolute;bottom:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:1.5px solid var(--panel)}

  .note{display:flex;gap:9px;padding:11px 13px;border-radius:9px;font-size:12.5px;background:var(--panel-2);border:1px solid var(--border);margin:12px 0}
  .note.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
  .note.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
  .note .i{flex-shrink:0}

  .pañol{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:12.5px}
  .pañol .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  /* toast */
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 16px;font-size:13px;opacity:0;transition:.25s;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Manual ---------- */
  .manual{display:none;max-width:820px;padding:30px 26px 90px}
  .manual.on{display:block}
  .app.manual-mode .screen{display:none}
  .manual h1{font-size:26px;font-weight:700;margin:0 0 6px}
  .manual .lead{color:var(--muted);font-size:13.5px;margin-bottom:26px}
  .manual section{margin-bottom:30px;padding-bottom:22px;border-bottom:1px solid var(--border);scroll-margin-top:70px}
  .manual section:last-child{border:none}
  .manual h2{font-size:16px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .manual .where{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .manual .where code{background:var(--panel-2);padding:1px 6px;border-radius:4px;color:var(--fg)}
  .manual p{font-size:13.5px;margin:0 0 10px}
  .manual ol{margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.9}
  .manual b{color:var(--fg)}
  .manual .tchip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:12px}

  @media(max-width:820px){
    .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
    .sidebar.open{transform:none}
    .menu-btn{display:inline-flex!important}
    .screen,.manual{padding-left:16px;padding-right:16px}
  }
  .menu-btn{display:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--fg);align-items:center;justify-content:center;flex-shrink:0}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">niu<span class="dot">.</span>pack</div>
    <div class="plan-switch">
      <div class="lbl">Plan activo</div>
      <div class="plan-btns" id="planBtns">
        <button class="plan-btn" data-plan="basico">Básico</button>
        <button class="plan-btn" data-plan="pro">Pro</button>
        <button class="plan-btn active" data-plan="caterpillar">Cat.</button>
      </div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
  </aside>

  <main class="content">
    <div class="topbar">
      <div class="crumb">
        <button class="menu-btn" id="menuBtn" aria-label="Menú">☰</button>
        <span id="crumb"></span>
      </div>
      <div class="top-actions">
        <div class="mode-toggle">
          <button id="mSistema" class="active">Sistema</button>
          <button id="mManual">Manual</button>
        </div>
        <button class="help-btn" id="helpBtn" title="Ver el manual de esta pantalla">?</button>
      </div>
    </div>
    <div class="screen" id="screen"></div>
    <div class="manual" id="manual"></div>
  </main>
</div>
<div id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const gs = n => 'Gs ' + Math.round(n).toLocaleString('es-PY');
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---------------- state ----------------
  const state = { plan:'caterpillar', route:'#/dashboard', mode:'sistema', stockCat:'todas', projTab:'presupuesto' };

  // ---------------- icons ----------------
  const I = {
    dash:'M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z',
    proj:'M3 21h18M4 21V7l8-4 8 4v14M9 21v-5h6v5',
    truck:'M1 3h15v13H1zM16 8h4l3 3v5h-7M5.5 19a2 2 0 100-4 2 2 0 000 4zm12 0a2 2 0 100-4 2 2 0 000 4z',
    file:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6',
    box:'M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8',
    receipt:'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z',
    wallet:'M21 12V7H5a2 2 0 010-4h14v4M3 5v14a2 2 0 002 2h16v-5M18 12a2 2 0 000 4h4v-4z',
    users:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zm14 10v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75',
    tag:'M20 10l-8-8H4v8l8 8 8-8zM7 7h.01',
    contact:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM19 8v6M22 11h-6',
    fx:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M9 15l6-6M9 9h.01M15 15h.01'
  };
  const icon = d => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

  // ---------------- nav model ----------------
  const NAV = [
    { g:null, items:[ {r:'#/dashboard',t:'Dashboard',i:'dash'} ] },
    { g:null, items:[ {r:'#/proyectos',t:'Proyectos',i:'proj',plan:'pro'} ] },
    { g:'Compras', items:[
      {r:'#/proveedores',t:'Proveedores',i:'truck'},
      {r:'#/cotizaciones',t:'Cotizaciones',i:'file'},
      {r:'#/ordenes',t:'Órdenes de compra',i:'box'},
      {r:'#/facturas',t:'Facturas',i:'receipt'},
      {r:'#/pagos',t:'Pagos',i:'wallet'},
      {r:'#/stock',t:'Stock',i:'box',plan:'caterpillar'},
    ]},
    { g:'Ventas', items:[
      {r:'#/clientes',t:'Clientes',i:'contact'},
      {r:'#/proformas',t:'Proformas',i:'tag'},
      {r:'#/remisiones',t:'Remisiones',i:'file'},
      {r:'#/facturas-venta',t:'Facturas de Venta',i:'receipt'},
      {r:'#/notas-credito',t:'Notas de Crédito',i:'fx'},
      {r:'#/cobros',t:'Cobros',i:'wallet'},
    ]},
  ];
  const PLAN_RANK = { basico:0, pro:1, caterpillar:2 };
  const visible = it => !it.plan || PLAN_RANK[state.plan] >= PLAN_RANK[it.plan];

  function renderNav(){
    const cur = state.route.split('/').slice(0,2).join('/');
    $('#sbNav').innerHTML = NAV.map(sec=>{
      const items = sec.items.filter(visible);
      if(!items.length) return '';
      const head = sec.g ? `<div class="sb-group">${sec.g}</div>` : '';
      return head + items.map(it=>{
        const active = state.route === it.r || state.route.startsWith(it.r+'/');
        return `<a class="sb-link${active?' active':''}" href="${it.r}">${icon(I[it.i])}<span>${it.t}</span></a>`;
      }).join('');
    }).join('');
    document.querySelectorAll('#planBtns .plan-btn').forEach(b=>b.classList.toggle('active',b.dataset.plan===state.plan));
  }

  // ---------------- mock data ----------------
  const D = {
    proyectos:[
      { id:'p1', code:'MOPC-2026-0034', name:'Pavimentación Ruta 7 — Tramo Minga Guazú', client:'MOPC — Región 7', pct:38, contractual:1305525000, comprado:412300000, estado:'ACTIVO', cat:true },
      { id:'p2', code:'OBR-2026-011', name:'Barrio Cerrado Los Lapachos — Infraestructura', client:'Inmobiliaria del Este SA', pct:62, contractual:890000000, comprado:551000000, estado:'ACTIVO', cat:false },
      { id:'p3', code:'OBR-2026-004', name:'37 Viviendas — Minga Guazú', client:'FONAVIS', pct:81, contractual:2044000000, comprado:1663000000, estado:'ACTIVO', cat:true },
    ],
    presupuesto:[
      { c:'1', d:'MOVIMIENTO DE SUELOS', u:'', q:null, pu:null, sub:96400000, dep:0 },
      { c:'1.1', d:'Excavación y desmonte', u:'m3', q:8200, pu:8500, sub:69700000, dep:1 },
      { c:'1.2', d:'Relleno y compactación', u:'m3', q:3100, pu:8600, sub:26660000, dep:1 },
      { c:'2', d:'PAQUETE ESTRUCTURAL', u:'', q:null, pu:null, sub:742600000, dep:0 },
      { c:'2.1', d:'Base granular e=20cm', u:'m2', q:24000, pu:12800, sub:307200000, dep:1 },
      { c:'2.2', d:'Carpeta asfáltica en caliente e=5cm', u:'m2', q:24000, pu:18100, sub:434400000, dep:1 },
      { c:'3', d:'OBRAS COMPLEMENTARIAS', u:'', q:null, pu:null, sub:171100000, dep:0 },
      { c:'3.1', d:'Cordón cuneta de hormigón', u:'ml', q:4800, pu:26500, sub:127200000, dep:1 },
      { c:'3.2', d:'Señalización horizontal', u:'m2', q:1900, pu:23100, sub:43900000, dep:1 },
    ],
    consumo:[
      { rubro:'2.1 Base granular', prod:'Piedra triturada 6ta', qty:'420 m3', costo:52300000, presup:307200000, pct:17 },
      { rubro:'2.2 Carpeta asfáltica', prod:'Cemento asfáltico CA-30', qty:'88 tn', costo:196400000, presup:434400000, pct:45 },
      { rubro:'3.1 Cordón cuneta', prod:'Cemento Portland', qty:'610 bolsas', costo:17568000, presup:127200000, pct:14 },
    ],
    ejecucion:[
      { d:'06/09/2026', item:'2.2 Carpeta asfáltica en caliente', qty:'1.240 m2', by:'portal', photos:2, gps:true },
      { d:'05/09/2026', item:'2.1 Base granular e=20cm', qty:'980 m2', by:'portal', photos:3, gps:true },
      { d:'04/09/2026', item:'3.1 Cordón cuneta de hormigón', qty:'160 ml', by:'interno', photos:1, gps:false },
      { d:'02/09/2026', item:'1.2 Relleno y compactación', qty:'220 m3', by:'portal', photos:2, gps:true },
    ],
    certificados:[
      { n:6, periodo:'Agosto 2026', bruto:98240000, liquido:73680000, estado:'APROBADO' },
      { n:7, periodo:'Septiembre 2026', bruto:65276250, liquido:48957187, estado:'BORRADOR' },
    ],
    certLineas:[
      { c:'2.1', d:'Base granular e=20cm', contr:24000, ant:9200, pres:4100, unit:12800 },
      { c:'2.2', d:'Carpeta asfáltica e=5cm', contr:24000, ant:5400, pres:0, unit:18100 },
      { c:'3.1', d:'Cordón cuneta de hormigón', contr:4800, ant:2400, pres:640, unit:26500 },
      { c:'3.2', d:'Señalización horizontal', contr:1900, ant:0, pres:0, unit:23100 },
    ],
    stockProyecto:[
      { p:'Cemento Portland (bolsa)', comp:1200, cons:610, disp:590 },
      { p:'Piedra triturada 6ta (m3)', comp:600, cons:420, disp:180 },
      { p:'Cemento asfáltico CA-30 (tn)', comp:120, cons:88, disp:32 },
      { p:'Hierro Ø10 (barra)', comp:400, cons:410, disp:-10 },
    ],
    cotizaciones:[

            <div style="position:absolute;left:${off}%;width:${w*([.6,.9,.3,.1,0][i]||0)}%;top:0;bottom:0;background:var(--nav-active);border-radius:5px"></div>
          </div></div>`;}).join('')}
      <div style="font-size:11px;color:var(--muted);margin-top:6px">Barra clara = planificado · barra sólida = ejecutado</div>
    </div></div>`;
  };

  PROJ_BODY.ejecucion = () => `
    <div class="filters"><button class="btn sm primary" data-toast="+ Registrar avance (demo)">+ Registrar avance</button>
      <button class="btn sm" data-toast="QR para el capataz — lo escanea y carga el parte con cámara verificada (demo)">QR para el capataz</button></div>
    <div class="card"><div class="t-wrap"><table>
      <thead><tr><th>Fecha</th><th>Ítem</th><th class="num">Ejecutado</th><th>Origen</th><th>Fotos</th></tr></thead>
      <tbody>${D.ejecucion.map(e=>`<tr>
        <td style="color:var(--muted)">${e.d}</td>
        <td>${esc(e.item)}</td>
        <td class="num">${e.qty}</td>
        <td>${e.by==='portal'?'<span class="badge b-teal">Capataz · QR</span>':'<span class="badge b-neutral">Interno</span>'}</td>
        <td><div class="photo-row">${Array.from({length:e.photos}).map((_,i)=>`<span class="photo" style="background:linear-gradient(135deg,#3a3527,#24262f)">${e.gps?'<span class="vdot"></span>':''}</span>`).join('')}${e.gps?'<span style="font-size:10px;color:var(--ok)">✓ verificada</span>':'<span style="font-size:10px;color:var(--warn)">archivo</span>'}</div></td>
      </tr>`).join('')}</tbody>
    </table></div></div>
    <div class="note ok"><span class="i">📷</span><span>Las fotos del capataz entran por <b>cámara in-app</b> (no galería) y quedan selladas con GPS + fecha/hora. El punto verde en la miniatura y "✓ verificada" indican captura confiable.</span></div>`;

  PROJ_BODY.compras = () => `<div class="card"><div class="t-wrap"><table>
    <thead><tr><th>Código</th><th>Proveedor</th><th class="num">Total</th><th>Estado</th></tr></thead>
    <tbody>${D.ordenes.slice(0,3).map(o=>`<tr><td style="font-weight:600">${o.code}</td><td>${esc(o.prov)}</td><td class="num">${gs(o.total)}</td><td><span class="badge ${o.tone}">${o.estado}</span></td></tr>`).join('')}</tbody>
  </table></div></div><p style="font-size:12px;color:var(--muted)">Solo lectura — la vinculación se hace asignando el proyecto a la OC desde el módulo de Compras.</p>`;

  PROJ_BODY.certificados = () => {
    const acum = (l)=>l.ant+l.pres;
    const bruto = D.certLineas.reduce((s,l)=>s+l.pres*l.unit,0);
    return `<div class="filters"><button class="btn sm primary" data-toast="+ Nuevo certificado (demo)">+ Nuevo certificado</button>
      <button class="btn sm" data-toast="Gestionar unidades físicas (demo)">Gestionar unidades</button></div>
    <div class="card"><div class="t-wrap"><table>
      <thead><tr><th>Nº</th><th>Período</th><th class="num">Monto bruto</th><th class="num">Monto líquido</th><th>Estado</th><th></th></tr></thead>
      <tbody>${D.certificados.map(c=>`<tr><td style="font-weight:700">N° ${c.n}</td><td>${c.periodo}</td><td class="num">${gs(c.bruto)}</td><td class="num" style="font-weight:600">${gs(c.liquido)}</td>
        <td><span class="badge ${c.estado==='APROBADO'?'b-ok':'b-accent'}">${c.estado}</span></td>
        <td><button class="btn sm" data-toast="Descargando PDF del certificado (demo)">PDF</button></td></tr>`).join('')}</tbody>
    </table></div></div>
    <div class="card"><div class="card-h">Certificado N° 7 — Septiembre 2026 <span class="badge b-accent">BORRADOR</span></div>
    <div class="t-wrap"><table>
      <thead><tr><th>Rubro</th><th class="num">Contractual</th><th class="num">Anterior</th><th class="num">Presente</th><th class="num">Acumulado</th><th class="num">% avance</th></tr></thead>
      <tbody>${D.certLineas.map(l=>`<tr><td>${l.c} ${esc(l.d)}</td>
        <td class="num" style="color:var(--muted)">${l.contr.toLocaleString('es-PY')}</td>
        <td class="num">${l.ant.toLocaleString('es-PY')}</td>
        <td class="num" style="color:var(--primary);font-weight:600">${l.pres.toLocaleString('es-PY')}</td>
        <td class="num">${acum(l).toLocaleString('es-PY')}</td>
        <td class="num">${Math.round(acum(l)/l.contr*100)}%</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="card-b" style="border-top:1px solid var(--border)">
      <table style="max-width:420px">
        <tr><td>Monto bruto</td><td class="num">${gs(bruto)}</td></tr>
        <tr><td style="color:var(--muted)">Devolución anticipo (20%)</td><td class="num" style="color:var(--error)">−${gs(bruto*.2)}</td></tr>
        <tr><td style="color:var(--muted)">Retención (5%)</td><td class="num" style="color:var(--error)">−${gs(bruto*.05)}</td></tr>
        <tr><td style="font-weight:700;border-top:2px solid var(--border)">Monto líquido</td><td class="num" style="font-weight:700;border-top:2px solid var(--border)">${gs(bruto*.75)}</td></tr>
      </table>
    </div></div>`;
  };

  PROJ_BODY.stock = () => `
    <div class="pañol"><div><div class="k">Depósito / Pañol vinculado</div><b>Pañol MOPC-2026-0034 — Ruta 7</b></div><a href="#/stock" style="font-size:12px;color:var(--nav-active)">Ver stock global →</a></div>
    <div class="card"><div class="card-h">Stock imputado a esta obra</div><div class="t-wrap"><table>
      <thead><tr><th>Producto</th><th class="num">Comprado</th><th class="num">Consumido</th><th class="num">Disponible</th></tr></thead>
      <tbody>${D.stockProyecto.map(r=>`<tr><td>${esc(r.p)}</td>
        <td class="num">${r.comp.toLocaleString('es-PY')}</td>
        <td class="num">${r.cons.toLocaleString('es-PY')}</td>
        <td class="num" style="color:${r.disp<0?'var(--error)':r.disp===0?'var(--muted)':'var(--ok)'};font-weight:700">${r.disp.toLocaleString('es-PY')}</td></tr>`).join('')}</tbody>
    </table></div></div>
    <p style="font-size:11.5px;color:var(--muted)">"Disponible" puede ser negativo si se consumió más de lo que se compró para la obra (ej. Hierro Ø10: se tomó prestado de otra obra).</p>`;

  PROJ_BODY.avance = () => `
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Curva S física: planificado (del cronograma) vs ejecutado (de los certificados congelados).</p>
    <div class="card"><div class="card-b">
      <svg viewBox="0 0 420 170" width="100%" height="170">
        <line x1="30" y1="150" x2="400" y2="150" stroke="var(--border)"/>
        <line x1="30" y1="150" x2="30" y2="14" stroke="var(--border)"/>
        <polyline points="30,150 90,132 150,104 210,70 270,44 330,26 400,16" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
        <polyline points="30,150 90,138 150,116 210,92 270,64" fill="none" stroke="var(--nav-active)" stroke-width="2.5"/>
        <circle cx="270" cy="64" r="4" fill="var(--nav-active)"/>
        <text x="6" y="18" font-size="9" fill="var(--muted)">100%</text>
        <text x="10" y="153" font-size="9" fill="var(--muted)">0%</text>
      </svg>
      <div style="display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:4px">
        <span>— — Planificado</span><span style="color:var(--nav-active)">—— Ejecutado</span>
      </div>
      <div class="note warn" style="margin-bottom:0"><span class="i">📉</span><span>Semana 5: planificado 44% · real 38% → atraso de ~${gs(0.06*1305525000)}. Días de lluvia del período: 4 (justifican prórroga).</span></div>
    </div></div>`;

  PROJ_BODY.personal = () => `<div class="card"><div class="t-wrap"><table>
    <thead><tr><th>Fecha</th><th>Trabajador</th><th class="num">Horas</th><th class="num">Costo/h</th><th class="num">Total</th></tr></thead>
    <tbody>
      <tr><td style="color:var(--muted)">05/09</td><td>J. Benítez (oficial)</td><td class="num">9</td><td class="num">${gs(38000)}</td><td class="num">${gs(342000)}</td></tr>
      <tr><td style="color:var(--muted)">05/09</td><td>R. Alderete (ayudante)</td><td class="num">9</td><td class="num">${gs(28000)}</td><td class="num">${gs(252000)}</td></tr>
      <tr><td style="color:var(--muted)">05/09</td><td>Cuadrilla asfalto (x6)</td><td class="num">54</td><td class="num">${gs(30000)}</td><td class="num">${gs(1620000)}</td></tr>
    </tbody></table></div></div>`;

  PROJ_BODY.subcontratistas = () => `<div class="card"><div class="t-wrap"><table>
    <thead><tr><th>Subcontratista</th><th>Rubro</th><th class="num">Contratado</th><th class="num">Certificado</th><th>Estado</th></tr></thead>
    <tbody>
      <tr><td>Vial Sur SRL</td><td>2.2 Carpeta asfáltica</td><td class="num">${gs(434400000)}</td><td class="num">${gs(97740000)}</td><td><span class="badge b-ok">ACTIVO</span></td></tr>
      <tr><td>Demarcaciones PY</td><td>3.2 Señalización horizontal</td><td class="num">${gs(43900000)}</td><td class="num">${gs(0)}</td><td><span class="badge b-neutral">SIN INICIAR</span></td></tr>
    </tbody></table></div></div>`;

  function head(title, sub){ return `<div class="page-h"><div><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div>
    <div style="display:flex;gap:8px">${title==='Dashboard'?'':`<button class="btn primary" data-toast="Nuevo — diálogo (demo)">+ Nuevo</button>`}</div></div>`; }

  // ---------------- manual ----------------
  const MANUAL = [
    ['activar','Activar el plan','all','nav derecho → <code>Planes</code>','Cada plan <b>suma</b> funciones sobre el anterior. Con Pro aparece <b>Proyectos</b>; con Caterpillar aparece además <b>Stock</b> y las tabs de Personal, Subcontratistas y Certificados dentro del proyecto.'],
    ['cotizaciones','Cotizaciones (RFQ)','basico','sidebar → <code>Cotizaciones</code>','Le pedís precio a varios proveedores para el mismo producto. Cada uno recibe un link propio sin login, carga su oferta, y al elegir una se genera la Orden de Compra sola.'],
    ['ordenes','Órdenes de compra','basico','sidebar → <code>Órdenes de compra</code>','El compromiso formal de compra. Cada OC tiene código y saldo (facturado vs pendiente). Si activaste Stock, al recibir mercadería recepcionás la OC y el inventario se actualiza solo.'],
    ['facturas','Facturas de compra','basico','sidebar → <code>Facturas</code>','Una IA lee las facturas (foto o PDF): proveedor por RUC, número, fecha, montos, timbrado. Auto-conciliación 2-de-3 (proveedor + monto + código OC). El matching nunca cruza proveedores.'],
    ['pagos','Órdenes de Pago','basico','sidebar → <code>Pagos</code>','Agrupás facturas aptas del mismo proveedor en una OP. Al marcarla Ejecutada, todas sus facturas pasan a Pagado.'],
    ['stock','Stock e Inventario','cat','sidebar → <code>Stock</code>','Categorías + productos + movimientos (ENTRADA/SALIDA/AJUSTE/TRANSFERENCIA). Valorización automática por Costo Promedio Ponderado. Cada SALIDA puede imputarse a una obra. Soporta múltiples depósitos y un pañol por proyecto.'],
    ['stock-proyecto','Stock / Materiales del proyecto','cat','proyecto → tab <code>Stock / Materiales</code>','Un solo depósito físico, control contable por obra: comprado − consumido = disponible. El "disponible" puede ser negativo si se consumió material tomado de otra obra.'],
    ['crear-proyecto','Crear un proyecto','pro','sidebar → <code>Proyectos</code> → <code>Nuevo proyecto</code>','Nombre, código, cliente, comitente y datos del contrato. Opción de crear automáticamente el depósito/pañol de la obra.'],
    ['presupuesto','Presupuesto','pro','proyecto → tab <code>Presupuesto</code>','Cómputo métrico. Tres formas de cargarlo: ítem por ítem, importar Excel con mapeo dinámico de columnas, o copiar de otro proyecto. Jerarquía por código (1, 1.1, 1.2) automática.'],
    ['ejecucion','Ejecución','pro','proyecto → tab <code>Ejecución</code>','El capataz carga el avance del día con hasta 5 fotos. Las fotos entran por <b>cámara in-app</b> (no galería) selladas con GPS + fecha/hora. El capataz recibe un <b>QR</b> que escanea una vez y agrega a la pantalla de inicio — sin login.'],
    ['certificados','Certificados al comitente','cat','proyecto → tab <code>Certificados</code>','Documento mensual para cobrarle al comitente (obra pública). Columnas Anterior / Presente / Acumulado por rubro, deducciones automáticas (anticipo, retención), workflow de firmas y PDF listo para firmar. "Pegar avance del mes" desde el Excel de medición.'],
    ['avance-fisico','Avance físico','cat','proyecto → tab <code>Avance físico</code>','Curva S (planificado del cronograma vs ejecutado de certificados congelados) + registro de días no trabajados (lluvia, feriados) que justifican prórrogas de plazo.'],
    ['facturas-venta','Facturas de Venta','basico','sidebar → <code>Facturas de Venta</code>','Genera cuenta por cobrar. Queda con saldo hasta que se registre un cobro.'],
    ['notas-credito','Notas de Crédito','basico','sidebar → <code>Notas de Crédito</code>','Anulación o ajuste de una factura de venta — desde la factura origen o libre. Emisión de factura electrónica (CDC) vía Goekua.'],
    ['cobros','Cobros','basico','sidebar → <code>Cobros</code>','Facturas con saldo separadas en vencidas / por vencer, con antigüedad de saldos por cliente (corriente / 1-30 / 31-60 / +60).'],
  ];
  const TCHIP = { all:['','#8b93a3'], basico:['Básico','#8b93a3'], pro:['Pro','#5b7cfa'], cat:['Caterpillar','#fb923c'] };
  const ROUTE_TO_MANUAL = {
    '#/dashboard':'activar','#/cotizaciones':'cotizaciones','#/ordenes':'ordenes','#/facturas':'facturas','#/pagos':'pagos',
    '#/stock':'stock','#/proyectos':'crear-proyecto','#/facturas-venta':'facturas-venta','#/notas-credito':'notas-credito','#/cobros':'cobros',
  };
  const TAB_TO_MANUAL = { presupuesto:'presupuesto',ejecucion:'ejecucion',certificados:'certificados',avance:'avance-fisico',stock:'stock-proyecto' };

  function renderManual(){
    $('#manual').innerHTML = `
      <h1>Manual del sistema</h1>
      <p class="lead">Referencia de cada módulo. Desde cualquier pantalla, el botón <b>?</b> te trae a la sección que corresponde.</p>
      ${MANUAL.map(([id,t,tier,where,body])=>{
        const [lbl,col]=TCHIP[tier];
        return `<section id="m-${id}">
          <h2>${esc(t)} ${lbl?`<span class="tchip" style="background:${col}22;color:${col}">${lbl}</span>`:''}</h2>
          <div class="where">Dónde: ${where}</div>
          <p>${body}</p>
        </section>`;
      }).join('')}`;
  }

  // ---------------- router ----------------
  function parse(){
    const h = location.hash || '#/dashboard';
    const parts = h.replace(/^#\//,'').split('/');
    if(parts[0]==='proyectos' && parts[1]) return { key:'proj', id:parts[1], tab:parts[2] };
    return { key:'#/'+parts[0], id:null, tab:null };
  }

  function render(){
    state.route = location.hash || '#/dashboard';
    renderNav();
    const scr = $('#screen');
    if(state.mode==='manual'){ document.body; $('#app').classList.add('manual-mode'); $('#manual').classList.add('on'); }
    else { $('#app').classList.remove('manual-mode'); $('#manual').classList.remove('on'); }

    const p = parse();
    let crumbTxt = '';
    if(p.key==='proj'){
      const proj = D.proyectos.find(x=>x.id===p.id);
      scr.innerHTML = R.proj(p.id, p.tab);
      crumbTxt = `<b>Proyectos</b> <span class="sep">/</span> ${esc(proj?proj.name:'—')}`;
    } else if(R[p.key]){
      scr.innerHTML = R[p.key]();
      const link = NAV.flatMap(s=>s.items).find(it=>it.r===p.key);
      crumbTxt = `<b>${link?link.t:'niu.pack'}</b>`;
    } else {
      scr.innerHTML = R['#/dashboard'](); crumbTxt='<b>Dashboard</b>';
    }
    $('#crumb').innerHTML = crumbTxt;
    document.querySelectorAll('.sidebar.open').forEach(s=>s.classList.remove('open'));
    window.scrollTo(0,0);
  }

  // ---------------- events ----------------
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }

  function toSistema(){ if(state.mode!=='sistema'){ state.mode='sistema'; $('#mSistema').classList.add('active'); $('#mManual').classList.remove('active'); } }

  document.addEventListener('click', e=>{
    const nav = e.target.closest('.sb-link');
    if(nav) toSistema();
    const go = e.target.closest('[data-go]');
    if(go){ toSistema(); location.hash = go.dataset.go; return; }
    const tabl = e.target.closest('.tab');
    if(tabl) toSistema();
    const tt = e.target.closest('[data-toast]');
    if(tt){ toast(tt.dataset.toast); return; }
    const cat = e.target.closest('[data-cat]');
    if(cat){ state.stockCat = cat.dataset.cat; render(); return; }
    const pb = e.target.closest('#planBtns .plan-btn');
    if(pb){
      state.plan = pb.dataset.plan;
      // si la ruta actual dejó de estar visible, volver al dashboard
      const p = parse();
      if(p.key==='#/stock' && state.plan!=='caterpillar'){ location.hash='#/dashboard'; }
      else if(p.key==='proj' && state.plan==='basico'){ location.hash='#/dashboard'; }
      else render();
      return;
    }
  });

  $('#mSistema').addEventListener('click', ()=>{ state.mode='sistema'; $('#mSistema').classList.add('active'); $('#mManual').classList.remove('active'); render(); });
  $('#mManual').addEventListener('click', ()=>{ state.mode='manual'; renderManual(); $('#mManual').classList.add('active'); $('#mSistema').classList.remove('active'); render(); });
  $('#helpBtn').addEventListener('click', ()=>{
    state.mode='manual'; renderManual();
    $('#mManual').classList.add('active'); $('#mSistema').classList.remove('active');
    render();
    const p = parse();
    let anchor = ROUTE_TO_MANUAL[p.key] || 'activar';
    if(p.key==='proj') anchor = TAB_TO_MANUAL[p.tab||'presupuesto'] || 'crear-proyecto';
    setTimeout(()=>{
      const el = document.getElementById('m-'+anchor);
      if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.style.transition='background .3s'; el.style.background='var(--panel-2)'; setTimeout(()=>el.style.background='',1400); }
    },60);
  });
  $('#menuBtn').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));

  window.addEventListener('hashchange', render);
  renderManual();
  render();
})();
</script>
</body>
</html>
